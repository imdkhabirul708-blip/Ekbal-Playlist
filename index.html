<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ekbal Playlist</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:white;
  min-height:100vh;

  background:
    radial-gradient(circle at 85% 10%,#a9632c35,transparent 30%),
    radial-gradient(circle at 10% 90%,#60341625,transparent 30%),
    linear-gradient(135deg,#050505,#1b1008,#050505);
}

header{
  padding:22px;
  text-align:center;
  border-bottom:1px solid #ffffff12;
}

.logo{
  font-size:25px;
  font-weight:bold;
  letter-spacing:4px;
}

.logo span{
  color:#e7a65c;
}

.container{
  width:min(800px,92%);
  margin:auto;
}

.hero{
  text-align:center;
  padding:45px 10px 28px;
}

.hero h1{
  font-size:40px;
  margin:10px 0;
}

.hero h1 span{
  color:#e7a65c;
}

.hero p{
  color:#999;
}

/* MUSIC CARD */

.music-card{
  padding:25px;
  border-radius:25px;

  background:
    linear-gradient(145deg,#21150d,#0d0d0d);

  border:1px solid #e7a65c25;

  box-shadow:
    0 25px 70px #000b;
}

.cover{
  width:170px;
  height:170px;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:30px;

  background:
    radial-gradient(circle at 35% 30%,#f1bb79,#79421e 40%,#100a06 80%);

  font-size:65px;

  box-shadow:
    0 20px 45px #000c,
    0 0 35px #e7a65c20;
}

.title{
  text-align:center;
  margin-top:20px;
}

.title h2{
  margin:0;
  font-size:23px;
}

.title p{
  margin:7px 0 0;
  color:#888;
  font-size:13px;
}

/* VISUALIZER */

.visualizer{
  height:40px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:5px;

  margin:20px 0;
}

.bar{
  width:4px;
  height:10px;

  background:#e7a65c;
  border-radius:10px;

  animation:music .8s infinite ease-in-out;
}

.bar:nth-child(2){animation-delay:.1s}
.bar:nth-child(3){animation-delay:.2s}
.bar:nth-child(4){animation-delay:.3s}
.bar:nth-child(5){animation-delay:.4s}
.bar:nth-child(6){animation-delay:.5s}
.bar:nth-child(7){animation-delay:.4s}
.bar:nth-child(8){animation-delay:.3s}
.bar:nth-child(9){animation-delay:.2s}
.bar:nth-child(10){animation-delay:.1s}

@keyframes music{
  0%,100%{height:8px}
  50%{height:35px}
}

/* YOUTUBE */

.youtube{
  margin-top:10px;

  border-radius:15px;
  overflow:hidden;

  border:1px solid #ffffff10;
}

.youtube iframe{
  display:block;

  width:100%;
  height:120px;

  border:0;
}

/* INFO */

.info{
  text-align:center;

  margin-top:15px;

  color:#e7a65c;
  font-size:12px;
  letter-spacing:1px;
}

/* FOOTER */

footer{
  text-align:center;
  color:#555;
  padding:40px 20px;
  font-size:12px;
}

@media(max-width:600px){

  .hero h1{
    font-size:32px;
  }

  .cover{
    width:145px;
    height:145px;
  }

  .youtube iframe{
    height:100px;
  }

}
</style>
</head>

<body>

<header>
  <div class="logo">
    EKBAL <span>PLAYLIST</span>
  </div>
</header>


<div class="container">

  <section class="hero">

    <h1>
      Feel the <span>Music.</span>
    </h1>

    <p>
      Your personal music playlist
    </p>

  </section>


  <div class="music-card">

    <div class="cover">
      🎵
    </div>


    <div class="title">

      <h2>
        Ekbal Playlist
      </h2>

      <p>
        YouTube Playlist · Now Playing
      </p>

    </div>


    <div class="visualizer">

      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>

    </div>


    <!-- YOUR FIXED PLAYLIST -->

    <div class="youtube">

      <iframe
        src="https://www.youtube.com/embed?listType=playlist&list=PLFtitMDpwfKY"
        title="Ekbal Playlist"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>

    </div>


    <div class="info">
      ● PLAYLIST READY
    </div>

  </div>

</div>


<footer>
  © 2026 Ekbal Playlist
</footer>

</body>
</html>
