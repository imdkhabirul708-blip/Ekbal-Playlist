<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ekbal Playlist</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#070707;
  --card:#111;
  --card2:#17120e;
  --gold:#e7a65c;
  --muted:#8d8d8d;
  --line:#ffffff12;
}

body{
  margin:0;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 85% 10%,#a85d2525,transparent 28%),
    radial-gradient(circle at 10% 80%,#6d3d1b18,transparent 30%),
    linear-gradient(145deg,#030303,#100b07,#050505);
  min-height:100vh;
}

header{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid var(--line);
  background:#050505cc;
  backdrop-filter:blur(18px);
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:22px;
  font-weight:800;
  letter-spacing:4px;
}

.logo span{color:var(--gold)}

.container{
  width:min(1050px,92%);
  margin:auto;
}

.hero{
  text-align:center;
  padding:48px 10px 30px;
}

.hero .eyebrow{
  color:var(--gold);
  font-size:11px;
  letter-spacing:3px;
  text-transform:uppercase;
}

.hero h1{
  font-size:48px;
  margin:15px 0 8px;
}

.hero h1 span{color:var(--gold)}

.hero p{
  color:var(--muted);
  margin:0;
}

/* SEARCH */

.search{
  padding:18px;
  border:1px solid var(--line);
  background:#101010dd;
  border-radius:22px;
  box-shadow:0 20px 60px #0009;
}

.input-row{
  display:flex;
  gap:10px;
}

input{
  flex:1;
  min-width:0;
  padding:16px;
  border-radius:13px;
  border:1px solid #ffffff15;
  background:#070707;
  color:white;
  outline:none;
  font-size:15px;
}

input:focus{
  border-color:#e7a65c66;
}

.load{
  padding:0 22px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,#f1b875,#cf833a);
  color:#160d06;
  font-weight:800;
  cursor:pointer;
}

/* PLAYER */

.player{
  display:none;
  margin-top:24px;
  padding:26px;
  border-radius:28px;
  background:
    radial-gradient(circle at 50% 0%,#c4773028,transparent 35%),
    linear-gradient(145deg,#1a120c,#0b0b0b);
  border:1px solid #e7a65c22;
  box-shadow:0 30px 90px #000b;
}

.player-main{
  display:grid;
  grid-template-columns:220px 1fr;
  gap:28px;
  align-items:center;
}

.cover{
  width:220px;
  aspect-ratio:1;
  border-radius:25px;
  object-fit:cover;
  background:
    radial-gradient(circle at 35% 25%,#f2bd7b,#74401f 38%,#0c0805 78%);
  box-shadow:0 25px 55px #000c;
}

.cover-fallback{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:70px;
}

.meta h2{
  font-size:26px;
  margin:0 0 8px;
  line-height:1.2;
}

.meta p{
  color:var(--muted);
  margin:0;
}

.visualizer{
  height:38px;
  display:flex;
  align-items:center;
  gap:4px;
  margin:25px 0 18px;
}

.bar{
  width:4px;
  height:10px;
  border-radius:8px;
  background:var(--gold);
  animation:pulse .9s ease-in-out infinite;
}

.bar:nth-child(2){animation-delay:.1s}
.bar:nth-child(3){animation-delay:.2s}
.bar:nth-child(4){animation-delay:.3s}
.bar:nth-child(5){animation-delay:.4s}
.bar:nth-child(6){animation-delay:.5s}
.bar:nth-child(7){animation-delay:.4s}
.bar:nth-child(8){animation-delay:.3s}
.bar:nth-child(9){animation-delay:.2s}
.bar:nth-child(10){animation-delay:.1s}

@keyframes pulse{
  0%,100%{height:8px}
  50%{height:34px}
}

.paused .bar{
  animation-play-state:paused;
  height:8px;
}

.progress{
  height:5px;
  background:#ffffff15;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
}

.progress-fill{
  width:0%;
  height:100%;
  background:var(--gold);
}

.times{
  display:flex;
  justify-content:space-between;
  color:#666;
  font-size:11px;
  margin-top:7px;
}

.controls{
  display:flex;
  align-items:center;
  gap:14px;
  margin-top:20px;
}

.control{
  width:45px;
  height:45px;
  border-radius:50%;
  border:1px solid #ffffff15;
  background:#ffffff08;
  color:white;
  cursor:pointer;
  font-size:17px;
}

.control:hover{
  background:#e7a65c22;
}

.play{
  width:58px;
  height:58px;
  border-radius:50%;
  border:0;
  background:linear-gradient(135deg,#f1b875,#cf833a);
  color:#160d06;
  font-size:21px;
  font-weight:bold;
  cursor:pointer;
}

.volume{
  margin-left:auto;
  width:110px;
  accent-color:var(--gold);
}

.status{
  margin-top:13px;
  color:var(--gold);
  font-size:11px;
  letter-spacing:1px;
}

/* PLAYLIST */

.playlist-section{
  margin-top:35px;
}

.heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.heading h2{
  margin:0;
  font-size:22px;
}

.heading span{
  color:var(--gold);
  font-size:11px;
  letter-spacing:2px;
}

.song-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.song{
  display:grid;
  grid-template-columns:45px 70px 1fr 45px;
  gap:14px;
  align-items:center;
  padding:10px;
  border-radius:16px;
  border:1px solid transparent;
  background:#0d0d0d;
  cursor:pointer;
  transition:.2s;
}

.song:hover{
  background:#15110e;
  border-color:#e7a65c22;
}

.song.active{
  background:#21170f;
  border-color:#e7a65c38;
}

.number{
  color:#777;
  text-align:center;
  font-size:12px;
}

.thumb{
  width:70px;
  height:45px;
  border-radius:9px;
  object-fit:cover;
  background:#21170e;
}

.song-title{
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.song-subtitle{
  color:#666;
  font-size:11px;
  margin-top:4px;
}

.song-play{
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#ffffff09;
  color:#e7a65c;
  cursor:pointer;
}

.empty{
  text-align:center;
  padding:30px;
  color:#666;
  border:1px dashed #ffffff15;
  border-radius:18px;
}

/* HIDDEN YOUTUBE PLAYER */

#youtube-player{
  position:fixed;
  width:1px;
  height:1px;
  left:-9999px;
  top:-9999px;
  opacity:0;
  pointer-events:none;
}

/* MOBILE */

@media(max-width:700px){

  .hero h1{font-size:36px}

  .input-row{
    flex-direction:column;
  }

  .load{
    height:50px;
  }

  .player-main{
    grid-template-columns:1fr;
    text-align:center;
  }

  .cover{
    width:min(220px,70vw);
    margin:auto;
  }

  .visualizer{
    justify-content:center;
  }

  .controls{
    justify-content:center;
  }

  .volume{
    display:none;
  }

  .song{
    grid-template-columns:30px 58px 1fr 38px;
    gap:8px;
  }

  .thumb{
    width:58px;
    height:40px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">EKBAL <span>PLAYLIST</span></div>
</header>

<div class="container">

<section class="hero">
  <div class="eyebrow">Personal Music Space</div>
  <h1>Feel the <span>Music.</span></h1>
  <p>अपनी YouTube Playlist यहाँ जोड़ें</p>
</section>

<div class="search">
  <div class="input-row">
    <input
      id="playlistInput"
      type="url"
      placeholder="https://www.youtube.com/playlist?list=..."
      autocomplete="off"
    >
    <button class="load" onclick="loadPlaylist()">
      Load Playlist
    </button>
  </div>
</div>

<section class="player" id="player">

  <div class="player-main">

    <div class="cover" id="cover">
      <div class="cover-fallback">🎵</div>
    </div>

    <div class="meta">

      <h2 id="currentTitle">Ekbal Playlist</h2>

      <p id="currentChannel">
        Ready to play
      </p>

      <div class="visualizer" id="visualizer">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>

      <div class="progress" id="progress">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="times">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>

      <div class="controls">

        <button class="control" onclick="previousSong()" title="Previous">
          ⏮
        </button>

        <button class="play" id="playBtn" onclick="togglePlay()" title="Play/Pause">
          ▶
        </button>

        <button class="control" onclick="nextSong()" title="Next">
          ⏭
        </button>

        <input
          class="volume"
          id="volume"
          type="range"
          min="0"
          max="100"
          value="100"
          onchange="setVolume(this.value)"
        >

      </div>

      <div class="status" id="status">
        ● READY
      </div>

    </div>

  </div>

</section>

<section class="playlist-section">

  <div class="heading">
    <h2>🎵 Your Playlist</h2>
    <span id="count">0 SONGS</span>
  </div>

  <div class="song-list" id="songList">
    <div class="empty">
      Paste a YouTube playlist link above to load your songs.
    </div>
  </div>

</section>

</div>

<!-- Official YouTube IFrame API player -->
<div id="youtube-player"></div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>

let player = null;
let playlistId = "";
let playlistItems = [];
let currentIndex = 0;
let timer = null;


/* YouTube API */

function onYouTubeIframeAPIReady(){

  player = new YT.Player("youtube-player",{

    height:"1",
    width:"1",

    playerVars:{
      playsinline:1,
      controls:0,
      rel:0,
      modestbranding:1
    },

    events:{
      onReady:onPlayerReady,
      onStateChange:onPlayerStateChange,
      onError:onPlayerError
    }

  });

}


function onPlayerReady(){

  setStatus("● PLAYER READY");

}


/* Load playlist */

function loadPlaylist(){

  const input =
    document.getElementById("playlistInput")
      .value.trim();

  if(!input){

    alert("पहले YouTube Playlist Link डालें।");
    return;

  }

  try{

    const url = new URL(input);

    const id =
      url.searchParams.get("list");

    if(!id){

      alert("कृपया सही YouTube Playlist Link डालें।");
      return;

    }

    playlistId = id;

    if(!player){

      alert("Player अभी तैयार हो रहा है। एक सेकंड बाद फिर कोशिश करें।");
      return;

    }

    player.loadPlaylist({
      list:playlistId,
      listType:"playlist",
      index:0,
      startSeconds:0
    });

    document.getElementById("player").style.display="block";

    setStatus("● LOADING PLAYLIST");

    /*
      The embedded player exposes the actual playlist.
      We use its playlist data to build our custom UI.
    */

    setTimeout(readPlaylist,1200);

  }catch(error){

    alert("Playlist URL सही नहीं है।");

  }

}


/* Read playlist from player */

function readPlaylist(){

  if(!player || !player.getPlaylist){

    return;
  }

  const ids =
    player.getPlaylist();

  if(!ids || !ids.length){

    return;
  }

  playlistItems =
    ids.map(function(videoId){

      return {
        id:videoId,
        title:"YouTube Song",
        thumbnail:
          "https://i.ytimg.com/vi/"
          + videoId
          + "/hqdefault.jpg"
      };

    });

  document.getElementById("count").textContent =
    playlistItems.length + " SONGS";

  renderSongs();

  updateCurrent();

}


/* Render playlist */

function renderSongs(){

  const list =
    document.getElementById("songList");

  list.innerHTML="";

  playlistItems.forEach(function(song,index){

    const item =
      document.createElement("div");

    item.className="song";

    item.dataset.index=index;

    item.innerHTML=`

      <div class="number">
        ${String(index+1).padStart(2,"0")}
      </div>

      <img
        class="thumb"
        src="${song.thumbnail}"
        alt=""
      >

      <div>
        <div class="song-title">
          ${escapeHtml(song.title)}
        </div>

        <div class="song-subtitle">
          YouTube
        </div>
      </div>

      <button
        class="song-play"
        onclick="playSong(${index});event.stopPropagation();">

        ▶

      </button>
    `;

    item.onclick=function(){

      playSong(index);

    };

    list.appendChild(item);

  });

}


/* Play selected song */

function playSong(index){

  if(!player){

    return;

  }

  currentIndex=index;

  player.playVideoAt(index);

  updateCurrent();

  setStatus("● NOW PLAYING");

}


/* Previous */

function previousSong(){

  if(!player){

    return;

  }

  player.previousVideo();

  setTimeout(updateCurrent,300);

}


/* Next */

function nextSong(){

  if(!player){

    return;

  }

  player.nextVideo();

  setTimeout(updateCurrent,300);

}


/* Play / Pause */

function togglePlay(){

  if(!player){

    return;

  }

  const state =
    player.getPlayerState();

  if(state === YT.PlayerState.PLAYING){

    player.pauseVideo();

  }else{

    player.playVideo();

  }

}


/* Volume */

function setVolume(value){

  if(player){

    player.setVolume(Number(value));

  }

}


/* Player state */

function onPlayerStateChange(event){

  if(event.data === YT.PlayerState.PLAYING){

    document.getElementById("playBtn")
      .textContent="❚❚";

    document.getElementById("visualizer")
      .classList.remove("paused");

    setStatus("● NOW PLAYING");

    startProgress();

    updateCurrent();

  }

  else if(event.data === YT.PlayerState.PAUSED){

    document.getElementById("playBtn")
      .textContent="▶";

    document.getElementById("visualizer")
      .classList.add("paused");

    setStatus("● PAUSED");

  }

  else if(event.data === YT.PlayerState.ENDED){

    document.getElementById("playBtn")
      .textContent="▶";

    setStatus("● SONG ENDED");

  }

}


/* Current song */

function updateCurrent(){

  if(!player){

    return;

  }

  const index =
    player.getPlaylistIndex();

  if(index === -1 || index === undefined){

    return;

  }

  currentIndex=index;

  const videoId =
    player.getVideoData()
      ? player.getVideoData().video_id
      : null;

  const data =
    player.getVideoData();

  if(data){

    document.getElementById("currentTitle")
      .textContent =
      data.title || "YouTube Song";

    document.getElementById("currentChannel")
      .textContent =
      data.author || "YouTube";

    if(videoId){

      document.getElementById("cover")
        .innerHTML=`
          <img
            src="https://i.ytimg.com/vi/${videoId}/hqdefault.jpg"
            style="width:100%;height:100%;object-fit:cover;border-radius:25px;"
            alt=""
          >
        `;

    }

  }

  document
    .querySelectorAll(".song")
    .forEach(function(el,i){

      el.classList.toggle(
        "active",
        i===currentIndex
      );

    });

}


/* Progress */

function startProgress(){

  clearInterval(timer);

  timer=setInterval(function(){

    if(!player || !player.getDuration){

      return;

    }

    const duration =
      player.getDuration();

    const current =
      player.getCurrentTime();

    if(duration>0){

      const percent =
        (current/duration)*100;

      document.getElementById("progressFill")
        .style.width=percent+"%";

      document.getElementById("currentTime")
        .textContent=formatTime(current);

      document.getElementById("duration")
        .textContent=formatTime(duration);

    }

  },500);

}


/* Seek */

document.getElementById("progress")
  .addEventListener("click",function(event){

    if(!player || !player.getDuration){

      return;

    }

    const rect =
      this.getBoundingClientRect();

    const percent =
      (event.clientX-rect.left)/rect.width;

    player.seekTo(
      player.getDuration()*percent,
      true
    );

  });


/* Status */

function setStatus(text){

  document.getElementById("status")
    .textContent=text;

}


/* Time */

function formatTime(seconds){

  seconds=Math.floor(seconds||0);

  const minutes=
    Math.floor(seconds/60);

  const secs=
    seconds%60;

  return minutes+
    ":"+
    String(secs).padStart(2,"0");

}


/* Error */

function onPlayerError(){

  setStatus("● THIS VIDEO CANNOT BE PLAYED");

}


/* Safety for song titles */

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

</body>
</html>
