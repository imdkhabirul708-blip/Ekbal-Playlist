<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ekbal Playlist</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
    overflow-x:hidden;
}

/* MAIN HERO */

.hero{
    position:relative;
    width:100%;
    min-height:100vh;
    overflow:hidden;

    background-image:url("cover.jpg");
    background-size:cover;
    background-position:center;
}

/* DARK OVERLAY */

.hero::after{
    content:"";
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.15),
            rgba(0,0,0,.15) 45%,
            rgba(0,0,0,.65)
        );

    z-index:1;
}


/* TOP BAR */

.topbar{
    position:absolute;
    top:25px;
    left:25px;
    right:25px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    z-index:5;

    font-size:15px;
}

.top-left{
    display:flex;
    gap:20px;
}

.top-right{
    display:flex;
    gap:25px;
}

.top-item{
    display:flex;
    align-items:center;
    gap:7px;

    color:white;

    text-shadow:0 2px 5px #000;
}

.icon{
    font-size:19px;
}


/* BIG TITLE */

.main-title{
    position:absolute;

    top:16%;
    left:50%;

    transform:translateX(-50%);

    z-index:4;

    width:90%;

    text-align:center;

    color:white;

    font-size:clamp(55px,10vw,145px);

    font-weight:900;

    line-height:.85;

    letter-spacing:-5px;

    text-shadow:
        0 4px 0 rgba(0,0,0,.5),
        0 7px 20px rgba(0,0,0,.8);
}

.main-title span{
    display:block;
}


/* MUSIC PLAYER */

.player{
    position:absolute;

    z-index:6;

    left:50%;
    bottom:35px;

    transform:translateX(-50%);

    width:min(720px,92%);

    height:115px;

    background:
        linear-gradient(
            90deg,
            rgba(85,45,35,.95),
            rgba(112,57,45,.92)
        );

    border-radius:65px;

    padding:15px 22px;

    display:flex;
    align-items:center;

    gap:18px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.6),
        inset 0 1px rgba(255,255,255,.1);

    backdrop-filter:blur(12px);
}


/* SONG COVER */

.song-cover{
    width:80px;
    height:80px;

    flex-shrink:0;

    border-radius:50%;

    overflow:hidden;

    border:3px solid rgba(255,255,255,.2);

    box-shadow:0 4px 15px rgba(0,0,0,.5);
}

.song-cover img{
    width:100%;
    height:100%;

    object-fit:cover;
}


/* SONG INFO */

.song-info{
    flex:1;

    min-width:0;
}

.song-name{
    font-size:16px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.artist{
    margin-top:5px;

    font-size:12px;

    opacity:.8;
}

.progress{
    width:100%;

    height:4px;

    margin-top:14px;

    background:rgba(255,255,255,.3);

    border-radius:10px;

    overflow:hidden;
}

.progress-bar{
    width:35%;

    height:100%;

    background:white;

    border-radius:10px;
}


/* PLAYER BUTTONS */

.player-controls{
    display:flex;

    align-items:center;

    gap:18px;
}

.control{
    border:0;

    background:transparent;

    color:white;

    font-size:17px;

    cursor:pointer;

    transition:.2s;
}

.control:hover{
    transform:scale(1.15);
}

.play{
    width:52px;
    height:52px;

    border-radius:50%;

    background:white;

    color:#6d3529;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:20px;

    border:0;

    cursor:pointer;

    box-shadow:0 5px 15px rgba(0,0,0,.3);
}


/* MOBILE */

@media(max-width:700px){

    .topbar{
        top:15px;
        left:15px;
        right:15px;

        font-size:12px;
    }

    .top-left{
        gap:10px;
    }

    .top-right{
        gap:10px;
    }

    .main-title{
        top:20%;

        font-size:18vw;

        letter-spacing:-3px;
    }

    .player{
        bottom:15px;

        height:90px;

        padding:10px 14px;

        gap:10px;

        border-radius:50px;
    }

    .song-cover{
        width:60px;
        height:60px;
    }

    .song-name{
        font-size:12px;
    }

    .artist{
        font-size:10px;
    }

    .progress{
        margin-top:8px;
    }

    .player-controls{
        gap:7px;
    }

    .control{
        font-size:13px;
    }

    .play{
        width:40px;
        height:40px;

        font-size:15px;
    }
}
</style>
</head>


<body>


<div class="hero">


    <!-- TOP BAR -->

    <div class="topbar">

        <div class="top-left">

            <div class="top-item">
                <span class="icon">●</span>
                11 PM
            </div>

            <div class="top-item">
                <span class="icon">☁</span>
                20°
            </div>

        </div>


        <div class="top-right">

            <div class="top-item">
                ⚙
                Spotify
            </div>

            <div class="top-item">
                ◉
                YT Music
            </div>

        </div>

    </div>



    <!-- MAIN TITLE -->

    <div class="main-title">

        <span>दिल से</span>

        <span>सुकून</span>

    </div>



    <!-- MUSIC PLAYER -->

    <div class="player">


        <!-- COVER -->

        <div class="song-cover">

            <img
                src="cover.jpg"
                alt="Song Cover"
            >

        </div>



        <!-- SONG DETAILS -->

        <div class="song-info">

            <div class="song-name">
                Mujhse Mohabbat Ka Izhaar Karta
            </div>

            <div class="artist">
                Ekbal Music Official
            </div>


            <div class="progress">

                <div
                    class="progress-bar"
                    id="progressBar">
                </div>

            </div>

        </div>



        <!-- CONTROLS -->

        <div class="player-controls">

            <button
                class="control"
                onclick="previousSong()">
                ⏮
            </button>


            <button
                class="play"
                id="playButton"
                onclick="togglePlay()">

                ▶

            </button>


            <button
                class="control"
                onclick="nextSong()">

                ⏭

            </button>

        </div>

    </div>

</div>



<script>

let playing = false;

let progress = 35;

function togglePlay(){

    const button =
        document.getElementById("playButton");

    if(!playing){

        playing = true;

        button.innerHTML = "❚❚";

    }else{

        playing = false;

        button.innerHTML = "▶";

    }

}


function nextSong(){

    progress = 0;

    document.getElementById(
        "progressBar"
    ).style.width = "0%";

    setTimeout(()=>{

        progress = 35;

        document.getElementById(
            "progressBar"
        ).style.width = "35%";

    },300);

}


function previousSong(){

    progress = 0;

    document.getElementById(
        "progressBar"
    ).style.width = "0%";

}


/* DEMO PROGRESS */

setInterval(()=>{

    if(playing){

        progress += .15;

        if(progress >= 100){

            progress = 0;

        }

        document.getElementById(
            "progressBar"
        ).style.width =
            progress + "%";

    }

},1000);

</script>


</body>
</html>
