<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ekbal Playlist</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:white;
  min-height:100vh;
  background:
    radial-gradient(circle at top right,#8b4f2530,transparent 35%),
    linear-gradient(135deg,#050505,#21140b,#080808);
}

header{
  padding:22px;
  text-align:center;
  border-bottom:1px solid #ffffff15;
}

.logo{
  font-size:25px;
  font-weight:bold;
  letter-spacing:3px;
}

.logo span{
  color:#e7a65c;
}

.container{
  width:min(850px,92%);
  margin:auto;
}

.hero{
  text-align:center;
  padding:45px 10px 30px;
}

.hero h1{
  font-size:40px;
  margin:10px 0;
}

.hero h1 span{
  color:#e7a65c;
}

.hero p{
  color:#999;
}

.player{
  padding:28px 20px;
  text-align:center;
  border-radius:22px;

  background:
    linear-gradient(145deg,#24170d,#0d0d0d);

  border:1px solid #e7a65c25;
  box-shadow:0 20px 60px #0009;
}

.music-icon{
  width:130px;
  height:130px;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:30px;

  background:
    linear-gradient(135deg,#8b4c21,#17100b);

  font-size:55px;

  box-shadow:0 18px 40px #000b;
}

.player h2{
  margin:20px 0 6px;
}

.player p{
  color:#888;
  font-size:13px;
}

.status{
  margin-top:18px;
  color:#e7a65c;
  font-size:13px;
}

.youtube{
  margin-top:20px;
  width:100%;
  border-radius:15px;
  overflow:hidden;
}

.youtube iframe{
  width:100%;
  height:120px;
  border:0;
}

footer{
  text-align:center;
  color:#555;
  padding:40px;
  font-size:12px;
}

@media(max-width:600px){
  .hero h1{
    font-size:32px;
  }

  .youtube iframe{
    height:100px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    EKBAL <span>PLAYLIST</span>
  </div>
</header>

<div class="container">

  <section class="hero">

    <h1>
      Feel the <span>Music.</span>
    </h1>

    <p>
      Welcome to Ekbal Playlist
    </p>

  </section>


  <div class="player">

    <div class="music-icon">
      🎵
    </div>

    <h2>
      Ekbal Playlist
    </h2>

    <p>
      Your music playlist
    </p>

    <div class="status">
      ● NOW PLAYING
    </div>


    <!-- YOUR FIXED YOUTUBE PLAYLIST -->

    <div class="youtube">

      <iframe
        src="https://www.youtube.com/embed?listType=playlist&list=PLFtitMDpwfKY"
        title="Ekbal Playlist"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>

    </div>

  </div>

</div>


<footer>
  © 2026 Ekbal Playlist
</footer>

</body>
</html>
