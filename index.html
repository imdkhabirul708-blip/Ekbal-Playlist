<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ekbal Playlist</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
}

.hero{
  position:relative;
  width:100%;
  min-height:100vh;
  overflow:hidden;
  background:#222;
}

.background{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  transition:.3s;
}

.overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.15),
    rgba(0,0,0,.2) 45%,
    rgba(0,0,0,.8)
  );
}

.topbar{
  position:absolute;
  z-index:5;
  top:20px;
  left:20px;
  right:20px;
  display:flex;
  justify-content:space-between;
  font-size:14px;
}

.main-title{
  position:absolute;
  z-index:4;
  top:18%;
  left:50%;
  transform:translateX(-50%);
  width:95%;
  text-align:center;
  font-size:clamp(55px,11vw,150px);
  line-height:.85;
  font-weight:900;
  text-shadow:0 5px 20px #000;
}

.main-title span{
  display:block;
}

.player{
  position:absolute;
  z-index:6;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  width:min(760px,94%);
  min-height:110px;
  padding:15px 20px;
  border-radius:60px;
  display:flex;
  align-items:center;
  gap:18px;
  background:rgba(85,45,35,.94);
  box-shadow:0 15px 40px #000;
}

.cover{
  width:78px;
  height:78px;
  flex-shrink:0;
  border-radius:50%;
  overflow:hidden;
  background:#333;
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.info{
  flex:1;
  min-width:0;
}

.song-name{
  font-size:16px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.artist{
  color:#ddd;
  font-size:12px;
  margin-top:5px;
}

.progress{
  width:100%;
  height:4px;
  margin-top:13px;
  background:#ffffff45;
  border-radius:10px;
  overflow:hidden;
}

.progress-bar{
  width:0%;
  height:100%;
  background:white;
}

.controls{
  display:flex;
  align-items:center;
  gap:15px;
}

.controls button{
  border:0;
  background:transparent;
  color:white;
  cursor:pointer;
  font-size:18px;
}

.play{
  width:50px;
  height:50px;
  border-radius:50%;
  background:white!important;
  color:#6b3328!important;
  font-size:18px!important;
}

.upload-area{
  position:absolute;
  z-index:10;
  left:50%;
  top:58%;
  transform:translate(-50%,-50%);
  display:flex;
  gap:10px;
}

.upload{
  background:rgba(0,0,0,.7);
  border:1px solid #fff5;
  color:white;
  padding:11px 16px;
  border-radius:25px;
  cursor:pointer;
  font-size:13px;
  backdrop-filter:blur(8px);
}

.upload:hover{
  background:#fff;
  color:#111;
}

input[type=file]{
  display:none;
}

@media(max-width:650px){

  .player{
    width:95%;
    min-height:90px;
    padding:10px 13px;
    gap:10px;
  }

  .cover{
    width:58px;
    height:58px;
  }

  .song-name{
    font-size:12px;
  }

  .artist{
    font-size:10px;
  }

  .controls{
    gap:7px;
  }

  .controls button{
    font-size:13px;
  }

  .play{
    width:40px;
    height:40px;
  }

  .upload-area{
    top:55%;
    flex-direction:column;
    width:160px;
  }

  .upload{
    text-align:center;
  }
}
</style>
</head>

<body>

<div class="hero">

  <div
    class="background"
    id="background"
  ></div>

  <div class="overlay"></div>


  <div class="topbar">
    <span>🎵 EKBAL</span>
    <span>YT Music</span>
  </div>


  <div class="main-title">
    <span>दिल से</span>
    <span>सुकून</span>
  </div>


  <!-- IMAGE + SONG UPLOAD -->

  <div class="upload-area">

    <label class="upload">
      🖼️ अपनी Image चुनें
      <input
        type="file"
        id="imageInput"
        accept="image/*"
      >
    </label>

    <label class="upload">
      🎵 अपना Song चुनें
      <input
        type="file"
        id="songInput"
        accept="audio/*"
      >
    </label>

  </div>


  <!-- PLAYER -->

  <div class="player">

    <div class="cover">
      <img
        id="coverImage"
        alt="Cover"
      >
    </div>


    <div class="info">

      <div
        class="song-name"
        id="songName"
      >
        अपना Song चुनें
      </div>

      <div
        class="artist"
        id="artist"
      >
        Ekbal Music
      </div>

      <div class="progress">
        <div
          class="progress-bar"
          id="progressBar"
        ></div>
      </div>

    </div>


    <div class="controls">

      <button id="previous">
        ⏮
      </button>

      <button
        class="play"
        id="play"
      >
        ▶
      </button>

      <button id="next">
        ⏭
      </button>

    </div>

  </div>

</div>


<audio id="audio"></audio>


<script>

const imageInput =
  document.getElementById("imageInput");

const songInput =
  document.getElementById("songInput");

const background =
  document.getElementById("background");

const coverImage =
  document.getElementById("coverImage");

const audio =
  document.getElementById("audio");

const play =
  document.getElementById("play");

const songName =
  document.getElementById("songName");

const progressBar =
  document.getElementById("progressBar");


/* IMAGE SELECT */

imageInput.addEventListener(
  "change",
  function(){

    const file = this.files[0];

    if(!file) return;

    const imageURL =
      URL.createObjectURL(file);

    background.style.backgroundImage =
      `url("${imageURL}")`;

    coverImage.src =
      imageURL;

  }
);


/* SONG SELECT */

songInput.addEventListener(
  "change",
  function(){

    const file = this.files[0];

    if(!file) return;

    const songURL =
      URL.createObjectURL(file);

    audio.src =
      songURL;

    songName.textContent =
      file.name.replace(/\.[^/.]+$/,"");

    play.textContent =
      "▶";

  }
);


/* PLAY / PAUSE */

play.addEventListener(
  "click",
  function(){

    if(!audio.src){

      alert(
        "पहले अपना Song चुनें"
      );

      return;
    }

    if(audio.paused){

      audio.play();

      play.textContent =
        "❚❚";

    }else{

      audio.pause();

      play.textContent =
        "▶";

    }

  }
);


/* PROGRESS */

audio.addEventListener(
  "timeupdate",
  function(){

    if(!audio.duration) return;

    const percent =
      (audio.currentTime /
       audio.duration) * 100;

    progressBar.style.width =
      percent + "%";

  }
);


/* SONG END */

audio.addEventListener(
  "ended",
  function(){

    play.textContent =
      "▶";

    progressBar.style.width =
      "0%";

  }
);


/* PREVIOUS */

document
.getElementById("previous")
.addEventListener("click",function(){

  audio.currentTime = 0;

});


/* NEXT */

document
.getElementById("next")
.addEventListener("click",function(){

  audio.currentTime = 0;

  if(audio.src){
    audio.play();
  }

});

</script>

</body>
</html>
